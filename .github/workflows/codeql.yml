name: CodeQL

on:
  pull_request:
  # Without a push trigger the default branch is only analysed by the cron, and
  # code scanning alerts for main lag behind it.
  push:
    branches: [main]
  schedule:
    # Weekly, so the scheduled run also covers advisories published since the
    # last pull request.
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Swift is left out on purpose: it needs a macOS runner and a full
        # Xcode build, which costs about as much as the native CI job for a
        # language that is a thin bridging layer here. Worth revisiting if the
        # Swift surface grows.
        language: ['javascript-typescript', 'java-kotlin']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # `languages`, not `language`: an unrecognised input is ignored, and
          # init then auto-detects every language in the repo, Swift included,
          # which cannot be analysed on an Ubuntu runner.
          languages: ${{ matrix.language }}

      # Autobuild treats android/ as a standalone project and fails the Android
      # plugin version check. The library only builds through the example app's
      # Gradle project, which needs the JS dependencies for the React Native
      # Gradle plugin.
      - name: Setup Node.js
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install JS dependencies
        if: matrix.language == 'java-kotlin'
        run: npm ci

      - name: Build the library
        if: matrix.language == 'java-kotlin'
        working-directory: example/android
        run: ./gradlew :ua_react-native-airship:compileDebugKotlin --console=plain

      - name: Autobuild
        if: matrix.language != 'java-kotlin'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
