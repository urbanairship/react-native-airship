name: CI

on: [pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # AirshipConfig.ts holds credentials and is gitignored, so the example
      # cannot typecheck or bundle without one.
      - name: Provide the example's Airship config
        run: cp example/src/AirshipConfig.ts.example example/src/AirshipConfig.ts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The native jobs build Debug, which loads JS from Metro at runtime and
      # never compiles it. Bundling is what fails on a missing import.
      - name: Bundle the example
        working-directory: example
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/index.android.bundle" \
            --assets-dest "$RUNNER_TEMP/assets"

  native:
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci
      - run: bash ./scripts/run_ci_tasks.sh -i
      - run: bash ./scripts/run_ci_tasks.sh -a
