name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  check-version:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Version
        run: bash ./scripts/check_version.sh "$GITHUB_REF_NAME"
      - name: Check release notes
        run: bash ./scripts/release_notes.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release_notes.md"

  module:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm publish --access public

  github-release:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          bash ./scripts/release_notes.sh "$VERSION" release_notes.md
          gh release create "$VERSION" --title "$VERSION" --notes-file release_notes.md --verify-tag

  publish-docs:
    needs: check-version
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  notify-release:
    if: always()
    needs: [check-version, module, github-release, publish-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.MOBILE_SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            attachments:
              - color: "${{ (contains(needs.*.result, 'failure') && 'danger') || (contains(needs.*.result, 'cancelled') && 'warning') || 'good' }}"
                text: "React Native Release: ${{ (contains(needs.*.result, 'failure') && 'failure') || (contains(needs.*.result, 'cancelled') && 'cancelled') || 'success' }} (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>)"
